<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geräteverleih – Gerät erfassen</title>
  </head>
  <body>
    <!-- Vertiefung 2: Seite mit Formular, erreichbar unter
         http://localhost:5177/src/vertiefungen/2-formular/ -->
    <main>
      <h1>Geräteverleih</h1>
      <p class="intro">
        Die Seite lädt die Geräte von der lokalen API unter <code>http://localhost:3005</code> und
        erfasst neue Geräte per <code>POST</code>.
      </p>

      <form class="new-device" novalidate>
        <h2>Gerät erfassen</h2>
        <label>
          Name
          <input name="name" autocomplete="off" />
          <span class="field-error" data-error-for="name"></span>
        </label>
        <label>
          Kategorie
          <select name="category">
            <option value="laptop">Laptop</option>
            <option value="monitor">Monitor</option>
            <option value="beamer">Beamer</option>
            <option value="headset">Headset</option>
          </select>
          <span class="field-error" data-error-for="category"></span>
        </label>
        <button>Erfassen</button>
        <p class="form-message"></p>
      </form>

      <label class="source">
        Szenario
        <select name="source">
          <option value="" disabled selected>Bitte wählen …</option>
          <option value="/api/devices">Alle Geräte</option>
          <option value="/api/devices?scenario=empty">Leere Liste</option>
          <option value="/api/geraete">Falscher Pfad</option>
          <option value="/api/devices?scenario=server-error">Serverfehler</option>
          <option value="/api/devices?scenario=invalid-json">Abgeschnittene Antwort</option>
          <option value="/api/devices?scenario=invalid-data">Ungültige Daten</option>
          <option value="/api/devices?scenario=network-error">Verbindungsabbruch</option>
          <option value="/api/devices?scenario=slow">Langsame Antwort</option>
          <option value="/api/devices/archived">Ausgemusterte Geräte</option>
        </select>
      </label>

      <section class="output"></section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

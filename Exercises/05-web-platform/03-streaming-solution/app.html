<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Übung 5.3: Streaming</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 800px; margin: 2rem auto; padding: 0 1rem; background: #f5f5f5; }
      #content { background: white; border: 2px solid #3498db; padding: 1rem; min-height: 200px; border-radius: 8px; }
      .stream-item { padding: 0.75rem; margin: 0.5rem 0; background: #ecf0f1; border-left: 4px solid #3498db; border-radius: 4px; animation: fadeIn 0.3s; }
      @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } }
      .message-text { font-weight: bold; }
      .timestamp { color: #7f8c8d; font-size: 0.85em; margin-top: 0.25rem; }
      button { background: #3498db; color: white; border: none; padding: 0.75rem 1.5rem; font-size: 1rem; border-radius: 5px; cursor: pointer; margin-bottom: 1rem; }
      button:disabled { background: #95a5a6; cursor: not-allowed; }
      .status { padding: 0.5rem; margin-bottom: 0.5rem; border-radius: 5px; font-weight: bold; }
      .status.active { background: #d4edda; color: #155724; }
      .status.complete { background: #cce5ff; color: #004085; }
      .status.error { background: #f8d7da; color: #721c24; }
    </style>
  </head>
  <body>
    <h1>Streaming-API</h1>
    <button id="fetchBtn">Stream laden</button>
    <div id="status"></div>
    <div id="content"></div>
    <script type="module" src="/app-script.js"></script>
  </body>
</html>

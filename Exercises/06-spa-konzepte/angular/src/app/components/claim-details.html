<article class="claim-details">
  <p class="claim-number">{{ claim().number }}</p>
  <h1>{{ claim().title }}</h1>
  <dl>
    <dt>Kunde</dt>
    <dd>{{ claim().customer }}</dd>
    <dt>Status</dt>
    <dd>
      <span class="status" [class]="'status-' + claim().status">{{
        statusLabels[claim().status]
      }}</span>
    </dd>
    <dt>Kategorie</dt>
    <dd>{{ categoryLabels[claim().category] }}</dd>
    <dt>Gemeldet am</dt>
    <dd>{{ formatDate(claim().reportedOn) }}</dd>
    <dt>Schadenbetrag</dt>
    <dd>{{ formatAmount(claim().amount) }}</dd>
  </dl>
  <p>{{ claim().description }}</p>
</article>

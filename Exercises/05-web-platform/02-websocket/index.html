<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:," />
    <title>Übung 5.2: WebSocket</title>
    <style>
      body { font-family: system-ui, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
      #messages { border: 1px solid #ccc; padding: 0.5rem; height: 300px; overflow-y: auto; margin-bottom: 1rem; background: #f9f9f9; }
      .message { margin: 0.25rem 0; }
      .received { color: #0066cc; }
      .sent { color: #008000; }
      .status { color: #888; font-style: italic; }
      form { display: flex; gap: 0.5rem; }
      input { flex: 1; padding: 0.5rem; }
      button { padding: 0.5rem 1rem; }
    </style>
  </head>
  <body>
    <h1>WebSocket-Chat</h1>
    <div id="messages"></div>
    <form id="messageForm">
      <input type="text" name="message" placeholder="Nachricht eingeben …" autocomplete="off" />
      <button>Senden</button>
    </form>
    <script type="module" src="client.js"></script>
  </body>
</html>

<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kursanmeldungen</title>
  </head>
  <body>
    <main>
      <h1>Kursanmeldungen</h1>
      <p class="intro">
        Die Datenquellen simulieren Antworten einer API. Einige davon enthalten fehlerhafte Daten.
      </p>

      <label class="source">
        Datenquelle
        <select name="source">
          <option value="" disabled selected>Bitte wählen …</option>
          <option value="/api/registrations.json">Gültige Anmeldungen</option>
          <option value="/api/registrations-empty.json">Leere Liste</option>
          <option value="/api/registrations-missing-name.json">Name fehlt</option>
          <option value="/api/registrations-id-as-text.json">Anmeldenummer als Text</option>
          <option value="/api/registrations-unknown-status.json">Unbekannter Status</option>
          <option value="/api/registrations-archive.json">Nicht vorhandene Datei</option>
        </select>
      </label>

      <section class="output"></section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
